[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "summary-generator"
version = "0.1.0"
description = "A FastAPI service which generates summary for bigger documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abhishek Sharma", email = "abhishekanand9962@gmail.com" }
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
serve = "summary_generator.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src/summary_generator"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
